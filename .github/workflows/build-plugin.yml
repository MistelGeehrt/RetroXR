name: build-plugin

on:
  push:
    paths: ["plugin/**", ".github/workflows/build-plugin.yml"]
  pull_request:
    paths: ["plugin/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S plugin -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: flatverse-plugin
          path: build/Release/flatverse.dll
