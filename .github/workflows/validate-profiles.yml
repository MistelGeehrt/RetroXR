name: validate-profiles

on:
  push:
    paths: ["profiles/**", "tools/validator/**"]
  pull_request:
    paths: ["profiles/**", "tools/validator/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python tools/validator/validate_profiles.py
